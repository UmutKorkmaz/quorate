name: Quorate
description: >-
  AI code review council for pull requests — several AI reviewers, one
  PASS/WARN/FAIL verdict with file-and-line evidence, posted as a PR comment.
author: Umut Korkmaz
branding:
  icon: users
  color: blue
inputs:
  config-path:
    description: >-
      Trusted base-branch config path. For pull_request safety this must remain
      .quorate.yml; alternate PR-controlled paths are rejected.
    required: false
    default: .quorate.yml
  mode:
    description: Council mode. Only review is implemented for the GitHub Action.
    required: false
    default: review
  providers:
    description: >-
      Comma-separated provider ids to enable for this run (overrides enabled: in
      .quorate.yml). Generate entries locally with `quorate provider add`.
    required: false
  pack:
    description: >-
      Domain pack(s) to layer onto the review: a comma-separated list (e.g.
      "solana,web3-dd") or "auto" to detect from the pull request's changed files.
      Adds pack councils + per-role reviewer guidance on top of the base config;
      the deterministic heuristics for a language always run regardless.
    required: false
  fail-on:
    description: >-
      Requested minimum failing severity. It may tighten the committed base
      policy, but never or a weaker value cannot relax that policy.
    required: false
    default: high
  post-comment:
    description: Whether to post or update the Quorate PR comment.
    required: false
    default: "true"
  github-token:
    description: GitHub token used to read PR files and write comments.
    required: false
  runner-mode:
    description: >-
      Provider runner mode: auto, cli, or api. `auto` is runner-aware — on
      GitHub-hosted runners it keeps only `api` providers (+ the built-in
      heuristic), since local agent CLIs can't be authenticated there. Set `cli`
      explicitly if your workflow preinstalls and authenticates agent CLIs.
    required: false
    default: auto
  inline-comments:
    description: Whether to post findings as inline review comments on changed lines.
    required: false
    default: "false"
  inline-comment-limit:
    description: Maximum number of inline review comments to post per run.
    required: false
    default: "10"
  baseline:
    description: >-
      Deprecated compatibility input. A canonical .quorate.baseline.json on the
      base branch is applied automatically when valid and unexpired; PR input
      cannot enable, disable, or redirect it.
    required: false
    default: "false"
  baseline-path:
    description: Canonical trusted baseline path; alternate paths are rejected.
    required: false
    default: .quorate.baseline.json
  suppress-path:
    description: >-
      Canonical trusted suppression-store path. Alternate paths are rejected;
      accepted-risk findings remain visible but ungated.
    required: false
    default: .quorate/suppressions.json
  policy-path:
    description: >-
      Canonical trusted VerdictGate policy path. Alternate paths are rejected;
      the base policy defines fail-on, agreement, required roles, and provider
      floor.
    required: false
    default: .quorate/policy.yml
  include-pr-context:
    description: >-
      Include redacted PR title/body/commit context in reviewer prompts. The
      context is treated as untrusted read-only text and byte-capped.
    required: false
    default: "false"
  reviewgraph:
    description: Include ReviewGraph agreement evidence in the PR comment and job summary.
    required: false
    default: "false"
  reviewgraph-file:
    description: >-
      Path to write ReviewGraph agreement evidence as JSON. Empty disables the
      sidecar export.
    required: false
    default: ""
  sarif-file:
    description: >-
      Path to write a SARIF 2.1.0 report. The written path is exposed as the
      `sarif-path` output; add a downstream `github/codeql-action/upload-sarif`
      step to publish it to the Security tab. Empty disables SARIF output.
    required: false
    default: ""
outputs:
  verdict:
    description: Final Quorate verdict.
  findings:
    description: Number of findings in the report.
  sarif-path:
    description: Absolute path of the written SARIF file (when sarif-file is set).
  reviewgraph-path:
    description: Absolute path of the written ReviewGraph JSON file (when reviewgraph-file is set).
runs:
  using: node20
  main: packages/github-action/dist/index.js
