name: Quorate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: quorate-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify trusted Action bundle
        shell: bash
        env:
          TRUSTED_ACTION_COMMIT: e965d46901ca910389f2733a6adf5224f609b7f5
          TRUSTED_ACTION_HASH: 1e545a101d50432f4b9385e925c1981ab8aa5c6f578f82a9ac48ee194a25bd1e
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TRUSTED_ACTION_COMMIT" origin/main
          actual_hash="$(git show "$TRUSTED_ACTION_COMMIT:packages/github-action/dist/index.js" | sha256sum | cut -d ' ' -f 1)"
          test "$actual_hash" = "$TRUSTED_ACTION_HASH"
      # Pinned to the reviewed v1.6.0 bundle commit instead of `uses: ./`:
      # the committed action bundle is PR-controlled code, so a local action on
      # pull_request would let a PR run its own dist/index.js with GLM_API_KEY
      # and a write-scoped GITHUB_TOKEN. Tradeoff: PRs are reviewed by the
      # reviewed bundle's code, not the PR's own code — bump this pin when
      # cutting a release.
      - uses: UmutKorkmaz/quorate@e965d46901ca910389f2733a6adf5224f609b7f5 # v1.6.0 reviewed bundle
        env:
          # Bearer token for the GLM-5.1 `api` provider in .quorate.yml. On
          # GitHub-hosted runners runner-mode `auto` resolves to `api`, so GLM
          # is the real reviewer here; the heuristic remains the safety baseline.
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          post-comment: "true"
          inline-comments: "true"
          # Dogfood the same high-severity gate that consumers get by default:
          # green means the report has no high/critical findings.
          fail-on: high
