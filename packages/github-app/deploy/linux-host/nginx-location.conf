# Include inside the existing HTTPS server for umutkorkmaz.net.
# These exact routes leave the website's existing proxy/location rules intact.
location = /quorate/health {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:3296/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

location = /quorate/api/webhook {
    limit_except POST { deny all; }
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:3296/api/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
