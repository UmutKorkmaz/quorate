<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#0b0f17" rx="12"/>
  <!-- Terminal window chrome -->
  <rect x="40" y="40" width="720" height="220" rx="8" fill="#121826" stroke="#2a3348" stroke-width="1.5"/>
  <rect x="40" y="40" width="720" height="36" rx="8" fill="#1a2234"/>
  <rect x="40" y="64" width="720" height="12" fill="#1a2234"/>
  <!-- Traffic lights -->
  <circle cx="68" cy="58" r="6" fill="#fb7185"/>
  <circle cx="88" cy="58" r="6" fill="#fbbf24"/>
  <circle cx="108" cy="58" r="6" fill="#34d399"/>
  <!-- Terminal title -->
  <text x="400" y="63" text-anchor="middle" font-family="monospace" font-size="12" fill="#7c8597">Terminal</text>
  <!-- Prompt line -->
  <text x="64" y="106" font-family="monospace" font-size="14" fill="#6e97ff">$</text>
  <text x="80" y="106" font-family="monospace" font-size="14" fill="#e2e8f0">npm i -g quorate</text>
  <!-- Output lines -->
  <text x="64" y="130" font-family="monospace" font-size="12" fill="#7c8597">added 1 package in 3s</text>
  <text x="64" y="150" font-family="monospace" font-size="12" fill="#34d399">✓ quorate@0.10.0 installed</text>
  <!-- Second prompt -->
  <text x="64" y="180" font-family="monospace" font-size="14" fill="#6e97ff">$</text>
  <text x="80" y="180" font-family="monospace" font-size="14" fill="#e2e8f0">quorate --version</text>
  <text x="64" y="200" font-family="monospace" font-size="12" fill="#7c8597">0.10.0</text>
  <!-- Blinking cursor -->
  <rect x="64" y="224" width="8" height="14" fill="#6e97ff" opacity="0.8"/>
</svg>
