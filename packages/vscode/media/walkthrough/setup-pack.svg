<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#0b0f17" rx="12"/>
  <!-- Panel background -->
  <rect x="40" y="30" width="720" height="240" rx="8" fill="#121826" stroke="#2a3348" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="#1a2234"/>
  <rect x="40" y="62" width="720" height="12" fill="#1a2234"/>
  <text x="400" y="57" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">Quorate — Set Up a Domain Pack</text>
  <!-- Pack options -->
  <rect x="64" y="94" width="672" height="32" rx="4" fill="#1a2234" stroke="#6e97ff" stroke-width="1.5"/>
  <text x="80" y="115" font-family="monospace" font-size="13" fill="#6e97ff">✦</text>
  <text x="100" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">Auto-detect from this repo</text>
  <text x="400" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#7c8597">quorate init --auto</text>

  <rect x="64" y="134" width="672" height="28" rx="4" fill="#121826"/>
  <text x="80" y="153" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">web</text>
  <text x="150" y="153" font-family="system-ui, sans-serif" font-size="11" fill="#7c8597">domain pack</text>

  <rect x="64" y="168" width="672" height="28" rx="4" fill="#121826"/>
  <text x="80" y="187" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">solana</text>
  <text x="150" y="187" font-family="system-ui, sans-serif" font-size="11" fill="#7c8597">domain pack</text>

  <rect x="64" y="202" width="672" height="28" rx="4" fill="#121826"/>
  <text x="80" y="221" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">llm</text>
  <text x="150" y="221" font-family="system-ui, sans-serif" font-size="11" fill="#7c8597">domain pack</text>

  <!-- Badge -->
  <rect x="620" y="94" width="90" height="20" rx="4" fill="#6e97ff" opacity="0.15"/>
  <text x="665" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6e97ff">SELECTED</text>
</svg>
