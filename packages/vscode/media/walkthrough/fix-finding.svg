<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#0b0f17" rx="12"/>
  <!-- Terminal window -->
  <rect x="40" y="30" width="720" height="220" rx="8" fill="#121826" stroke="#2a3348" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="36" rx="8" fill="#1a2234"/>
  <rect x="40" y="54" width="720" height="12" fill="#1a2234"/>
  <!-- Traffic lights -->
  <circle cx="68" cy="48" r="5" fill="#fb7185"/>
  <circle cx="86" cy="48" r="5" fill="#fbbf24"/>
  <circle cx="104" cy="48" r="5" fill="#34d399"/>
  <text x="400" y="53" text-anchor="middle" font-family="monospace" font-size="11" fill="#7c8597">Quorate Fix</text>
  <!-- CLI output -->
  <text x="64" y="90" font-family="monospace" font-size="12" fill="#6e97ff">$</text>
  <text x="80" y="90" font-family="monospace" font-size="12" fill="#e2e8f0">quorate fix --finding 1</text>
  <text x="64" y="112" font-family="monospace" font-size="11" fill="#7c8597">Fixing finding #1: Timing-unsafe token comparison</text>
  <text x="64" y="130" font-family="monospace" font-size="11" fill="#7c8597">  File: src/auth/login.ts:42</text>
  <text x="64" y="150" font-family="monospace" font-size="11" fill="#fbbf24">⚡ Delegating to agent…</text>
  <!-- Diff preview -->
  <rect x="64" y="162" width="672" height="14" rx="2" fill="#fb7185" opacity="0.1"/>
  <text x="72" y="173" font-family="monospace" font-size="10" fill="#fb7185">- return token === storedToken;</text>
  <rect x="64" y="178" width="672" height="14" rx="2" fill="#34d399" opacity="0.1"/>
  <text x="72" y="189" font-family="monospace" font-size="10" fill="#34d399">+ return crypto.timingSafeEqual(Buffer.from(token), Buffer.from(storedToken));</text>
