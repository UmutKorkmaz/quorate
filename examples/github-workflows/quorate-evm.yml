# Quorate — EVM / Solidity review example
#
# HOW TO USE:
#   1. Run `quorate init --pack evm` in your repo root to generate a
#      .quorate.yml with EVM / Solidity councils and role guidance.
#   2. Commit .quorate.yml to your base branch (the PR config must live on
#      the base branch — Quorate never reads it from the PR head).
#   3. Add OPENROUTER_API_KEY to your repository or organisation secrets.
#   4. Copy this file into your repo as .github/workflows/quorate.yml to
#      activate the workflow.
#
# The heuristic reviewer runs automatically with zero setup — no model, no
# key needed. `runner-mode: api` keeps the workflow on a standard
# GitHub-hosted runner (no self-hosted machine required).

name: Quorate — EVM review
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: UmutKorkmaz/quorate@v0.7.2
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          runner-mode: api
