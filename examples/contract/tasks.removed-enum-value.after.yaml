openapi: 3.0.3
info:
  title: Tasks API
  version: 2.0.0
  description: >-
    Small task-management API used as the ContractCourt fixture baseline.
    Every tasks.*.before.yaml file in examples/contract is a byte-identical
    copy of this spec; each tasks.*.after.yaml applies exactly one scenario.
servers:
  - url: https://api.example.com/v1
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List tasks
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of tasks to return (1-100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          description: Only return tasks with this status.
          schema:
            $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: A list of tasks matching the filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '200':
          description: Task created (legacy success code kept for older clients).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
  /tasks/{id}:
    get:
      operationId: getTask
      summary: Get a single task by id
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The requested task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTask
      summary: Patch a task
      description: Partial update; omitted fields keep their current values.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Numeric task identifier.
      schema:
        type: integer
        format: int32
  responses:
    BadRequest:
      description: Invalid request payload or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No task exists with this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Task:
      type: object
      description: A single task.
      required:
        - id
        - title
        - status
      properties:
        id:
          type: integer
          format: int32
          description: Numeric task identifier.
          readOnly: true
        title:
          type: string
          description: Short human-readable title.
        status:
          $ref: '#/components/schemas/TaskStatus'
        dueDate:
          type: string
          format: date
          description: Due date as an ISO-8601 calendar date (YYYY-MM-DD).
    TaskStatus:
      type: string
      description: Lifecycle state of a task; "in_progress" was removed in 2.0.
      enum:
        - todo
        - done
    TaskCreate:
      type: object
      description: Payload for creating a task.
      required:
        - title
      properties:
        title:
          type: string
          description: Short human-readable title.
        status:
          $ref: '#/components/schemas/TaskStatus'
        dueDate:
          type: string
          format: date
          description: Due date as an ISO-8601 calendar date (YYYY-MM-DD).
    TaskUpdate:
      type: object
      description: Partial update for a task; omitted fields keep their values.
      properties:
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        dueDate:
          type: string
          format: date
    Error:
      type: object
      description: Machine-readable error payload.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable error code, e.g. "task_not_found".
        message:
          type: string
          description: Human-readable explanation.
